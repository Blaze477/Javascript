<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spring Sign-Up</title>
  <link rel="stylesheet" href="Style.css" />
</head>
<body>
  <script src="Index.js"> </script>
    <img src="assest/spring picture.jpg" />

  <main class="container">
    <section class="left">
      <h1>Sign up for your <span class="highlight">free</span> Spring account</h1>
      <p>Become a Spring member to get free credit score monitoring, financial insights, and bright ideas for how you can grow your money.</p>
      <form>
        <input type="text" placeholder="First Name" required />
        <input type="text" placeholder="Last Name" required />
        <button type="submit">Let's Go!</button>
      </form>
    </section>

    <section class="right">
      <img src="assest/spring picture 2.jpg"/>
    </section>
  </main>
</body>
</html>
