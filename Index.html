<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail clone</title>
    <link rel="stylesheet" href="Style.css"/>
</head>
<body>
    <header class="navbar">
        <div class="logo">📧 Gmail</div>
        <nav class="nav-links">
        <a href="#">For work</a>
        <a href="#">Sign in</a>
        <button class="create-btn">Create an account</button>
    </nav>
    </header>

      <main class="main-content">
        <div class="text-area">
            <h1>Secure, smart and <br>easy to use email</h1>
            <p> Get more done with Gmail, Now integrated with Google Chat,<br> Google Meet, and more, all in one place. </p>
            <div class="buttons">
                <button class="create-btn">Create an account</button>
                <a href="#">For work</a>
            </div>
        </div>

        <div class="image-area">
            <img src="images/gmail-illustration.png" alt="Gmail UI" />
        </div>
      </main>


    </header>
</body>
</html>
